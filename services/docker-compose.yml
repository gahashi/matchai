services:
  minio:
    image: minio/minio:latest
    container_name: brava-pass-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: bravapass
      MINIO_ROOT_PASSWORD: bravapass123
    volumes:
      - ./minio/data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: brava-pass-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 bravapass bravapass123;
      mc mb -p local/brava-pass-dev;
      mc anonymous set download local/brava-pass-dev;
      exit 0;
      "
